<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Lost in Space</title>
    <link rel="stylesheet" type="text/css" href="../css/styles.css" />
  </head>
  <body>
    <canvas id="stars"></canvas>

    <!-- Mars -->
    <div class="mars" id="mars">
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
    </div>

    <!-- Meteor -->
    <div class="meteor" id="meteor">
      <div class="fire f1"></div>
      <div class="fire f2"></div>
      <div class="fire f3"></div>
    </div>

    <!-- Fragments container -->
    <div id="fragments"></div>

    <!-- Shockwave overlay -->
    <div id="shockwave"></div>

    <!-- Spaceship -->
    <div id="spaceship">
      <div class="body"></div>
      <div class="cockpit"></div>
      <div class="wing-left"></div>
      <div class="wing-right"></div>
      <div class="engine"></div>
      <div class="light light1"></div>
      <div class="light light2"></div>
      <div class="light light3"></div>
      <div class="light light4"></div>
    </div>

    <!-- Astronaut -->
    <div class="astronaut" id="astronaut">
      <div class="helmet"></div>
      <div class="body"></div>
      <div class="pack"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div class="content">
      <h1 class="title">404 – Destination Not Found</h1>
      <p class="subtitle">
        Our astronaut tried to reach Mars… but the cosmos had other plans.
      </p>
      <div class="buttons">
        <a href="/" class="btn primary">Return to Home Base</a>
        <button class="btn secondary" id="retry">Rescan Space</button>
      </div>
    </div>

    <!-- Overlay for scan effect -->
    <div id="scanOverlay"></div>

    <script src="../js/script.js"></script>
  </body>
</html>
